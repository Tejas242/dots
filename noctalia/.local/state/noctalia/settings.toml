    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "claude-code", "codex", "zen-browser", "obsidian", "vscode", "zed", "fastfetch", "zathura" ]

[wallpaper]
