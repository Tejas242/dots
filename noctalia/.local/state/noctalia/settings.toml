    [wallpaper.last]
    path = "/home/screenager/Pictures/Wallpapers/aesthetic-wallpapers-main/images/guy_sleeping_colored.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/screenager/Pictures/Wallpapers/aesthetic-wallpapers-main/images/guy_sleeping_colored.png"

