# ╔══════════════════════════════════════════════════════════════╗
# ║  widgets.toml — Per-widget tuning                          ║
# ║  Each [widget.<id>] customizes a bar widget.               ║
# ║  Only widgets that need non-default values are listed.     ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Workspaces ───────────────────────────────────────────────
# Slim pills; the focused one stretches. Primary for focus,
# muted for the rest, so the eye lands on where you are.
[widget.workspaces]
type               = "workspaces"
style              = "regular"
pill_scale         = 0.8
active_pill_size   = 2.4
focused_color      = "primary"
occupied_color     = "on_surface_variant"
empty_color        = "outline"


# ── Active Window ────────────────────────────────────────────
# What's focused. Capped so it never reaches the island.
[widget.active_window]
type         = "active_window"
icon_size    = 13.0
max_length   = 200.0
min_length   = 40.0
title_scroll = "on_hover"


# ── System Monitor ───────────────────────────────────────────
# CPU% and RAM as quiet numbers; they tint toward error only
# when something is actually busy.
[widget.cpu]
type            = "sysmon"
stat            = "cpu_usage"
visualization   = "none"
label_min_width = 26

[widget.ram]
type            = "sysmon"
stat            = "ram_used"
visualization   = "none"
label_min_width = 34


# ── Tray ─────────────────────────────────────────────────────
# One button; apps live in a drawer instead of the bar.
[widget.tray]
type   = "tray"
drawer = true


# ── Tools ────────────────────────────────────────────────────
[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.picker]
type = "oldirtty/color_picker:widget"


# ── Network / Volume / Battery ───────────────────────────────
# Glyphs only; the percentage stays on the battery.
[widget.network]
type       = "network"
show_label = false

[widget.output_volume]
type       = "volume"
show_label = false

[widget.battery]
type          = "battery"
display_mode  = "glyph"
show_label    = true
label_content = "percent"
