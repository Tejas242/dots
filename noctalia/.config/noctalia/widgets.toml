# ╔══════════════════════════════════════════════════════════════╗
# ║  widgets.toml — Per-widget tuning                          ║
# ║  Each [widget.<id>] customizes a bar widget.               ║
# ║  Only widgets that need non-default values are listed.     ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Workspaces ───────────────────────────────────────────────
# A page indicator, no numbers: the long pill is where you are,
# a light dot has windows, a dim dot is empty. The long pill
# stretches and glides when you switch.
[widget.workspaces]
type               = "workspaces"
style              = "regular"
show_labels        = false
pill_scale         = 0.55
active_pill_size   = 3.0
inactive_pill_size = 1.0
focused_color      = "primary"
occupied_color     = "on_surface_variant"
empty_color        = "outline"


# ── Calendar ─────────────────────────────────────────────────
# Beside the workspaces; click it for the calendar.
# Ember at the centre keeps the time.
[widget.calendar]
type    = "custom_button"
glyph   = "calendar"
tooltip = "Calendar"

[widget.calendar.actions]
left = "panel-toggle control-center calendar"


# ── Group gap ────────────────────────────────────────────────
# 5 + 8 + 5 = 18 px between groups.
[widget.gap]
type   = "spacer"
length = 8


# ── System Monitor ───────────────────────────────────────────
# CPU and RAM in the same unit and the same width, so they
# never jitter; they tint toward error only when busy.
[widget.cpu]
type            = "sysmon"
stat            = "cpu_usage"
visualization   = "none"
label_min_width = 26

[widget.ram]
type            = "sysmon"
stat            = "ram_pct"
visualization   = "none"
label_min_width = 26


# ── Tools (folded into the recorder, see bar.toml) ──────────
[widget.tray]
type   = "tray"
drawer = true

[widget.picker]
type = "oldirtty/color_picker:widget"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"


# ── Network / Volume / Battery ───────────────────────────────
# Glyphs only; the percentage stays on the battery.
[widget.network]
type       = "network"
show_label = false

[widget.output_volume]
type       = "volume"
show_label = false

[widget.battery]
type          = "battery"
display_mode  = "glyph"
show_label    = true
label_content = "percent"
