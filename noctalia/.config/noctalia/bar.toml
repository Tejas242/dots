# ╔══════════════════════════════════════════════════════════════╗
# ║  bar.toml — The frame around Ember                         ║
# ║  1366×768 · edge-to-edge glass · one ink, one rhythm        ║
# ╚══════════════════════════════════════════════════════════════╝
#
#  ┌────────────────┬──────────────────┬──────────────────────────────┐
#  │ ▬ • •   ▦      │   (Ember island) │ ▭   ◔ 34%  ▣ 56%   ᯤ ◁) ▭ 48% │
#  │ where you are  │  what's happening│ tools · machine · connection │
#  └────────────────┴──────────────────┴──────────────────────────────┘
#
#  The bar is the frame and Ember is the picture: it stays quiet so
#  the island can be alive. Rules:
#   · one ink: icons on_surface_variant, numbers on_surface;
#     colour only means something (primary = you are here,
#     error = busy CPU, recording, low battery)
#   · one rhythm: 5 px between items, 18 px between groups
#     (5 + a 8 px spacer + 5), 10 px ends like Ember's
#   · no capsules: nothing is boxed, so no gaps between pills
#
#  Config-only on purpose: Noctalia never rewrites files in
#  ~/.config/noctalia, so this survives updates. Keep GUI bar
#  edits out of ~/.local/state/noctalia/settings.toml (it wins).

[bar]
order = ["default"]

    [bar.default]
    enabled  = true
    position = "top"

    # ── Geometry ─────────────────────────────────────────────
    # 22 px: Ember reads this thickness and hangs from it.
    thickness      = 22
    padding        = 10
    widget_spacing = 5
    scale          = 1.0
    margin_edge          = 0
    margin_ends          = 0
    margin_opposite_edge = 0
    radius               = 0
    concave_edge_corners = false

    # ── Glass ────────────────────────────────────────────────
    # Translucent over niri's blur (rules.kdl). No border, no
    # shadow: a frosted strip, not a box.
    background_opacity = 0.55
    border             = "outline"
    border_width       = 0.0
    shadow             = false
    contact_shadow     = false
    capsule            = false

    # ── Ink & type ───────────────────────────────────────────
    icon_color      = "on_surface_variant"
    font_weight     = 500

    # ── Behaviour ────────────────────────────────────────────
    layer           = "top"
    reserve_space   = true
    auto_hide       = false
    hover_highlight = false
    show_on_workspace_switch = true
    panel_overlap   = 1

    # ── Layout ───────────────────────────────────────────────
    # Center is empty on purpose: Ember (~/Gems/ember) draws
    # the time, music and Claude there.
    start  = ["workspaces", "gap", "calendar"]
    center = []
    end    = ["group:tools", "gap", "cpu", "ram", "gap", "network", "output_volume", "battery"]

    # ── Tools fold into the recorder ─────────────────────────
    # Only the recorder shows (it turns red while recording);
    # hover it and the picker, clipboard and tray unfold to
    # its left. Invisible capsule: no pill, no padding.
    [[bar.default.capsule_group]]
    id                  = "tools"
    members             = ["tray", "picker", "clipboard", "recorder"]
    accordion           = true
    accordion_direction = "start"
    fill                = "surface"
    opacity             = 0.0
    padding             = 0
    widget_spacing      = 5
