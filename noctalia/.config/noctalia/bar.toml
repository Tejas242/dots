# ╔══════════════════════════════════════════════════════════════╗
# ║  bar.toml — Bar appearance and widget arrangement          ║
# ║  Optimized for 1366×768 · edge-to-edge · compact density   ║
# ╚══════════════════════════════════════════════════════════════╝

[bar]
order = ["default"]

    [bar.default]
    enabled  = true
    position = "top"

    # ── Geometry ─────────────────────────────────────────────
    # 22px: compact on a 768px screen, still room for text.
    # Flush to every edge; the island (Ember) hangs from the
    # middle of it, so the bar itself stays square.
    thickness      = 22
    padding        = 8
    widget_spacing = 4
    scale          = 1.0
    margin_edge          = 0
    margin_ends          = 0
    margin_opposite_edge = 0
    radius               = 0
    concave_edge_corners = false

    # ── Glass ────────────────────────────────────────────────
    # Translucent over niri's blur (rules.kdl). No border, no
    # shadow: the bar is a frosted strip, not a box.
    background_opacity = 0.55
    border             = "outline"
    border_width       = 0.0
    shadow             = false
    contact_shadow     = false
    capsule            = false

    # ── Type & behaviour ─────────────────────────────────────
    font_weight     = 500
    layer           = "top"
    reserve_space   = true
    auto_hide       = false
    hover_highlight = true
    show_on_workspace_switch = true
    panel_overlap   = 1

    # ── Layout ───────────────────────────────────────────────
    #  ┌──────────────────────┬────────────────┬─────────────────────────┐
    #  │ workspaces · window  │  (Ember island)│ stats · tools · system  │
    #  └──────────────────────┴────────────────┴─────────────────────────┘
    #  Center is empty on purpose: Ember (~/Gems/ember) draws the
    #  clock, music and Claude there as a dynamic island.
    start  = ["workspaces", "active_window"]
    center = []
    end    = ["cpu", "ram", "tray", "recorder", "picker", "clipboard", "network", "output_volume", "battery", "calendar"]
