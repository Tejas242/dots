# --- THEME INTEGRATION ---
# Replace 'theme_name.conf' with the actual filename Noctalia generated 
# (e.g., include themes/noctalia.conf)

# --- FONT SETTINGS ---
# Use IBM Plex Mono to match your system UI (very sharp on LCDs)
font_family      Jetbrains Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ESSENTIAL for your 0.8 scale on an LCD:
# This prevents letters from looking too thin or blurry.
hinting_style full

# --- MINIMAL UI ---
# Removes the title bar (Niri handles windows anyway)
hide_window_decorations yes

# Modern "breathing room" padding
window_padding_width 15

# --- CURSOR & MOUSE ---
cursor_shape block
cursor_blink_interval 0
mouse_hide_wait 3.0
detect_urls yes

# --- PERFORMANCE ---
# Lowers input lag
repaint_delay 10
input_delay 3
sync_to_monitor yes


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
